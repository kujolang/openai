[package]
name = "openai"
version = "0.1.2"
description = "Native OpenAI Responses API client for Kujo with an AI SDK provider driver."
license = "MIT"
repository = "https://github.com/kujolang/openai"
readme = "README.md"
[package.status]
stage = "experimental"
stability = "early"
public_api = true
[kujo]
minimum_version = "1.0.2"
entry = "openai.kujo"
sources = ["src", "."]
includes = ["docs", "examples", "README.md", "CHANGELOG.md", "tests", "AGENTS.md", "docs/OPENAI_IMPLEMENTATION_REPORT.md", "docs/OPENAI_PROVIDER_PACKAGE_CONFORMANCE.md"]
excludes = [".git", "dist", "build", "kennel_packages"]
[dependencies]
ai-sdk = { source = "github:kujolang/ai-sdk", ref = "v1.1.0" }
[scripts]
test = "bash scripts/release_quality_gate.sh"
verify-offline = "bash scripts/release_quality_gate.sh"
[package.exports]
openai = "src/openai.kujo"
provider = "src/provider.kujo"
